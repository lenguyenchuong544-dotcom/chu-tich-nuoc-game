# Workflow build và deploy Next.js (frontend) lên GitHub Pages
name: Deploy Next.js site to Pages

on:
  # Chạy tự động khi push code lên nhánh leeduc hoặc main
  push:
    branches: ["leeduc", "main", "master"]

  # Cho phép bấm nút "Run workflow" thủ công trên tab Actions của GitHub
  workflow_dispatch:

# Quyền hạn cấp cho GITHUB_TOKEN để xuất bản lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**/*.[jt]s', 'frontend/src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Build Next.js Static Export
        working-directory: ./frontend
        env:
          EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: "/chu-tich-nuoc-game"
          NEXT_PUBLIC_API_URL: "https://resurface-exert-reaffirm.ngrok-free.dev"
        run: npx next build

      - name: Verify static export output
        run: |
          echo "Listing frontend contents:"
          ls -la frontend
          if [ ! -d "frontend/out" ]; then
            echo "frontend/out not found!"
            exit 1
          fi
          echo "frontend/out exists! Listing out/:"
          ls -la frontend/out

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
